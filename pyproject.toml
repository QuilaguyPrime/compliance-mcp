[project]
name = "compliance-mcp"
version = "0.1.0"
description = "Servidor MCP sobre NIST SP 800-53 Rev 5 con recuperacion hibrida y citaciones verificadas"
readme = "README.md"
requires-python = ">=3.11"
# El nucleo no arrastra torch: los tests de recuperacion lexica, fusion,
# metricas y rehuso corren sin modelo de embeddings, de modo que el job de
# tests de CI instala en segundos. El indice denso vive en el extra `dense`.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dense = [
    "sentence-transformers>=3.0",
]
# El servidor y los proveedores. Verificado contra mcp 2.1, anthropic 1.3 y
# openai 3.7. `mcp>=2` no es cosmetico: en 2.x FastMCP paso a llamarse
# MCPServer y el modelo de datos paso a snake_case.
serve = [
    "mcp>=2.0",
    "anthropic>=1.0",
    "openai>=1.50",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
compliance-mcp = "compliance_mcp.server:main"
# Preflight sin red: comprueba corpus, indice, golden set y credenciales.
compliance-mcp-doctor = "compliance_mcp.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# SIM103: los filtros de metadatos se escriben como cadena de guard clauses.
# Colapsarlos en un `return not (...)` es mas corto y menos legible.
ignore = ["SIM103"]
