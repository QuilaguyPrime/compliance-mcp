# compliance-mcp — fuente unica de verdad para todo parametro.
# Regla del proyecto: ningun literal numerico o de modelo vive en el codigo.

corpus:
  catalog_path: data/raw/NIST_SP-800-53_rev5_catalog.json
  baseline_profiles:
    low: data/raw/NIST_SP-800-53_rev5_LOW-baseline_profile.json
    moderate: data/raw/NIST_SP-800-53_rev5_MODERATE-baseline_profile.json
    high: data/raw/NIST_SP-800-53_rev5_HIGH-baseline_profile.json
    privacy: data/raw/NIST_SP-800-53_rev5_PRIVACY-baseline_profile.json
  records_path: data/processed/records.jsonl
  chunks_dir: data/processed
  index_dir: data/index

ingest:
  # Los placeholders {{ insert: param }} anidan dentro de select.choice.
  # Medido en fase 1: 1 pasada deja 44 controles con placeholders crudos, 4 pasadas dejan 0.
  param_resolution_passes: 4
  # Formato con el que se sustituye un parametro definido por la organizacion.
  param_template: "[{label}]"
  # Los controles retirados se indexan (marcados) para poder responder
  # "AC-3(1) fue retirado e incorporado a AC-3" en vez de "no existe".
  include_withdrawn: true
  # Partes OSCAL que se consideran contenido de evaluacion (SP 800-53A).
  assessment_part_prefixes: ["assessment-objective", "assessment-method", "assessment-objects"]

chunking:
  # Estrategia activa en produccion. Justificada en README con la tabla de ablacion.
  active: C
  strategies:
    A:
      description: "Un chunk por control: cabecera + statement + guidance."
      include_parts: [statement, guidance]
      split_by_part: false
    B:
      description: "Como A mas el contenido de evaluacion SP 800-53A."
      include_parts: [statement, guidance, assessment]
      split_by_part: false
    C:
      description: "Un chunk por parte, cada uno con el contexto jerarquico heredado."
      include_parts: [statement, guidance]
      split_by_part: true
  # Cabecera de contexto heredado que se antepone a cada chunk.
  header_template: "{family_title} ({family_id}){parent_segment} > {label} {title}"
  parent_segment_template: " > {parent_title} ({parent_id})"
  part_marker_template: "[{part_name}]"
  withdrawn_marker_template: "[withdrawn] Incorporated into: {targets}"

retrieval:
  bm25:
    k1: 1.5
    b: 0.75
    stopwords: [the, a, an, and, or, of, to, in, for, on, that, is, are, be, as, by, with, at, from, it, its, this]
    token_pattern: "[a-z0-9]+"
  dense:
    model: BAAI/bge-base-en-v1.5
    # bge exige este prefijo en la consulta (no en los documentos).
    query_prefix: "Represent this sentence for searching relevant passages: "
    normalize: true
    batch_size: 64
  fusion:
    # RRF: score = sum_i w_i / (rrf_k + rank_i)
    # Valores elegidos por barrido SOLO sobre el split de train (n=20).
    # Ver data/derived/sweep.json. Las diferencias en la cima de la rejilla
    # estan dentro del ruido de muestreo a este tamano.
    rrf_k: 30
    weight_bm25: 0.15
    weight_dense: 1.0
  # Numero de candidatos que aporta cada retriever antes de fusionar.
  candidate_pool: 100
  parent_rollup:
    # Si un enhancement entra en el ranking, su control padre recibe alpha * credito.
    # Corrige que 872 enhancements desplacen a 324 controles base.
    enabled: true
    alpha: 0.8
  top_k: 5
  max_top_k: 20
  # Por defecto search_controls oculta los retirados; get_control siempre los devuelve.
  default_include_withdrawn: false

evaluation:
  golden_set_path: data/golden/golden_set.yaml
  # Split determinista por hash del id del caso. Los hiperparametros solo se
  # ajustan en train; el README reporta test.
  split:
    train_fraction: 0.5
    seed: 20260901
  metrics:
    recall_at_k: [1, 3, 5, 10]
    ndcg_at_k: 10
  bootstrap:
    # Con n=60 el IC95 de recall@5 tiene ancho ~0.22. Se reporta siempre.
    resamples: 20000
    confidence: 0.95
    seed: 20260901
  ablation:
    chunking_strategies: [A, B, C]
    retrieval_methods: [bm25, dense, hybrid]
    output_path: data/derived/ablation.json
  # Barrido de hiperparametros. Solo se ejecuta sobre el split de train.
  sweep:
    weight_bm25: [0.0, 0.15, 0.3, 0.5, 1.0]
    rrf_k: [30, 60, 120]
    parent_rollup_alpha: [0.0, 0.5, 0.8]
    output_path: data/derived/sweep.json

gates:
  # Umbrales que el job de eval de CI hace cumplir. Si el eval cae por debajo, falla.
  min_recall_at_5: 0.60
  min_citation_precision: 0.95
  max_hallucinated_citation_rate: 0.0

logging:
  level: INFO
  format: json
  trace_id_field: trace_id
