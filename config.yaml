# compliance-mcp — fuente unica de verdad para todo parametro.
# Regla del proyecto: ningun literal numerico o de modelo vive en el codigo.

corpus:
  catalog_path: data/raw/NIST_SP-800-53_rev5_catalog.json
  baseline_profiles:
    low: data/raw/NIST_SP-800-53_rev5_LOW-baseline_profile.json
    moderate: data/raw/NIST_SP-800-53_rev5_MODERATE-baseline_profile.json
    high: data/raw/NIST_SP-800-53_rev5_HIGH-baseline_profile.json
    privacy: data/raw/NIST_SP-800-53_rev5_PRIVACY-baseline_profile.json
  records_path: data/processed/records.jsonl
  chunks_dir: data/processed
  index_dir: data/index
  # Manifiesto que certifica de que texto salio cada indice denso. Cargar un
  # indice sin manifiesto, o con uno que no cuadra, es un error duro.
  index_manifest: data/index/manifest.json

ingest:
  # Los placeholders {{ insert: param }} anidan dentro de select.choice.
  # Medido en fase 1: 1 pasada deja 44 controles con placeholders crudos, 4 pasadas dejan 0.
  param_resolution_passes: 4
  # Formato con el que se sustituye un parametro definido por la organizacion.
  param_template: "[{label}]"
  # Los controles retirados se indexan (marcados) para poder responder
  # "AC-3(1) fue retirado e incorporado a AC-3" en vez de "no existe".
  include_withdrawn: true
  # Partes OSCAL que se consideran contenido de evaluacion (SP 800-53A).
  assessment_part_prefixes: ["assessment-objective", "assessment-method", "assessment-objects"]

chunking:
  # Estrategia activa en produccion. Justificada en README con la tabla de ablacion.
  active: C
  strategies:
    A:
      description: "Un chunk por control: cabecera + statement + guidance."
      include_parts: [statement, guidance]
      split_by_part: false
    B:
      description: "Como A mas el contenido de evaluacion SP 800-53A."
      include_parts: [statement, guidance, assessment]
      split_by_part: false
    C:
      description: "Un chunk por parte, cada uno con el contexto jerarquico heredado."
      include_parts: [statement, guidance]
      split_by_part: true
  # Cabecera de contexto heredado que se antepone a cada chunk.
  header_template: "{family_title} ({family_id}){parent_segment} > {label} {title}"
  parent_segment_template: " > {parent_title} ({parent_id})"
  part_marker_template: "[{part_name}]"
  withdrawn_marker_template: "[withdrawn] Incorporated into: {targets}"

retrieval:
  bm25:
    k1: 1.5
    b: 0.75
    stopwords: [the, a, an, and, or, of, to, in, for, on, that, is, are, be, as, by, with, at, from, it, its, this]
    token_pattern: "[a-z0-9]+"
  dense:
    model: BAAI/bge-base-en-v1.5
    # bge exige este prefijo en la consulta (no en los documentos).
    query_prefix: "Represent this sentence for searching relevant passages: "
    normalize: true
    batch_size: 64
  fusion:
    # RRF: score = sum_i w_i / (rrf_k + rank_i)
    # Valores elegidos por barrido SOLO sobre el split de train (n=20).
    # Ver data/derived/sweep.json. Las diferencias en la cima de la rejilla
    # estan dentro del ruido de muestreo a este tamano.
    rrf_k: 30
    weight_bm25: 0.15
    weight_dense: 1.0
  # Numero de candidatos que aporta cada retriever antes de fusionar.
  candidate_pool: 100
  parent_rollup:
    # Si un enhancement entra en el ranking, su control padre recibe alpha * credito.
    # Corrige que 872 enhancements desplacen a 324 controles base.
    enabled: true
    alpha: 0.8
  # Metodo servido en produccion y celda que el gate hace cumplir.
  method: hybrid
  top_k: 5
  max_top_k: 20
  # Por defecto search_controls oculta los retirados; get_control siempre los devuelve.
  default_include_withdrawn: false

generation:
  # Cadena de proveedores: se intentan en orden y se cae al siguiente ante
  # cualquier fallo del anterior. La degradacion se loguea con el trace_id, de
  # modo que en los logs se puede separar "respondio el primario" de "respondio
  # el fallback" sin mirar la respuesta.
  providers:
    - name: anthropic
      model: claude-opus-5
      max_tokens: 4096
      # low | medium | high | xhigh | max. La tarea es extractiva sobre un
      # contexto ya recuperado, no un problema de razonamiento abierto.
      effort: medium
      timeout_s: 60
      max_retries: 2
    - name: openai
      model: gpt-4o-2024-08-06
      max_tokens: 4096
      timeout_s: 60
      max_retries: 2
  # Precio de lista en USD por millon de tokens, por modelo. Vive aqui y no en
  # el codigo por la misma razon que todo lo demas, y ademas porque cambia sin
  # avisar: un precio incrustado en el codigo se queda viejo en silencio y
  # convierte el coste por consulta publicado en ficcion.
  #
  # `checked_at` es la fecha en que se contrastaron con el proveedor. Si esta
  # vieja, el coste calculado es una estimacion con fecha de caducidad, y el
  # informe lo dice en vez de presentarlo como medido.
  pricing:
    checked_at: "2026-09-02"
    usd_per_mtok:
      claude-opus-5:
        input: 5.00
        output: 25.00
      gpt-4o-2024-08-06:
        input: 2.50
        output: 10.00
  # Baseline determinista y sin red. No sustituye al LLM: es el suelo contra el
  # que se compara en la evaluacion y el doble que usan los tests, para que la
  # suite corra sin claves de API.
  baseline_provider: extractive
  context:
    # Cuantos controles recuperados entran en el prompt.
    top_k: 5
    # Partes del registro que ve el modelo. Es tambien el universo de lo
    # citable: la verificacion compara contra exactamente este texto, no contra
    # el registro completo, para que citar de memoria parametrica no cuele.
    parts: [statement, guidance]
    # Corte por parte. Se corta en frontera de linea para no partir un item
    # numerado del statement por la mitad.
    max_part_chars: 4000
  citations:
    # Una cita mas corta que esto no ancla nada: "the organization" aparece
    # literalmente en cientos de controles.
    min_quote_chars: 24
    max_quote_chars: 400
    # Politica ante una cita que no se puede verificar contra el contexto.
    on_unverified: drop
    # Si tras descartar no queda ninguna cita verificada, la respuesta se
    # convierte en rehuso. Esto es lo que hace que la tasa de citas alucinadas
    # SERVIDAS sea cero por construccion, en vez de por confiar en el modelo.
    refuse_without_citations: true
    # Toda etiqueta tipo [AC-2] que aparezca en la prosa debe corresponder a una
    # cita verificada; si no, la respuesta no se sirve.
    require_inline_refs_verified: true
  # Normalizacion aplicada a los dos lados antes de comparar una cita literal.
  # Sin colapsar espacios, un salto de linea del aplanado del statement basta
  # para que una cita correcta se marque como inventada.
  quote_match:
    collapse_whitespace: true
    casefold: true
    strip_chars: " \t\n\"'.,;:()[]"

evaluation:
  golden_set_path: data/golden/golden_set.yaml
  # Split determinista por hash del id del caso. Los hiperparametros solo se
  # ajustan en train; el README reporta test.
  split:
    train_fraction: 0.5
    seed: 20260901
  metrics:
    recall_at_k: [1, 3, 5, 10]
    ndcg_at_k: 10
  bootstrap:
    # Con n=60 el IC95 de recall@5 tiene ancho ~0.22. Se reporta siempre.
    resamples: 20000
    confidence: 0.95
    seed: 20260901
  ablation:
    chunking_strategies: [A, B, C]
    retrieval_methods: [bm25, dense, hybrid]
    output_path: data/derived/ablation.json
  # Barrido de hiperparametros. Solo se ejecuta sobre el split de train.
  sweep:
    weight_bm25: [0.0, 0.15, 0.3, 0.5, 1.0]
    rrf_k: [30, 60, 120]
    parent_rollup_alpha: [0.0, 0.5, 0.8]
    output_path: data/derived/sweep.json

  generation:
    output_path: data/derived/generation.json
    # El bloque resumen se inyecta ademas en el fichero de la ablacion para que
    # el gate de CI lo lea sin cambiar de ruta ni de contrato.
    merge_into_ablation: true
    # chain = cadena real de proveedores (gasta API). extractive = baseline.
    provider: chain
    # Unidades que convierten un numero en una cantidad afirmada. Se usa para
    # detectar cifras que la respuesta afirma sin que aparezcan en ninguna cita
    # verificada: en Rev 5 casi todo periodo y umbral es definido por la
    # organizacion, asi que una cifra sin fuente es la alucinacion tipica.
    quantity_units:
      [second, seconds, minute, minutes, hour, hours, day, days, week, weeks,
       month, months, year, years, character, characters, attempt, attempts,
       bit, bits, percent, time, times]

gates:
  # Umbrales que el job de eval de CI hace cumplir. Si el eval cae por debajo, falla.
  #
  # La holgura de min_recall_at_5 es deliberada. El valor medido es 0.8636 sobre
  # n=22 casos, donde un solo caso vale 0.0455 y el IC95 va de 0.727 a 1.000. Un
  # umbral cenido a la medicion (0.80, por ejemplo) fallaria por ruido de muestreo
  # cada vez que un caso cambiase de lado, y un gate que falla sin que nada se haya
  # roto se acaba desactivando. 0.60 es un detector de regresion catastrofica -un
  # indice caducado, una fusion mal ponderada, un corpus que no cuadra-, no de
  # calidad marginal. Para lo marginal estan los IC de ablation.json.
  min_recall_at_5: 0.60
  # El gate exigente son estos dos, y no se han ejecutado nunca: dependen de la
  # evaluacion de generacion, que gasta API y sigue pendiente (fase 5). Un gate que
  # hoy no puede fallar es informacion, no verguenza: dice con precision que parte
  # del sistema esta medida y cual no.
  min_citation_precision: 0.95
  max_hallucinated_citation_rate: 0.0

logging:
  level: INFO
  format: json
  trace_id_field: trace_id
