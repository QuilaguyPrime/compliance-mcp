# Golden set de compliance-mcp — 60 casos escritos y revisados a mano.
#
# Composicion (fijada por el arquitecto del proyecto):
#   30 respondibles   — con control esperado como ground truth
#   15 no respondibles — el comportamiento correcto es rehusar explicitamente
#   15 adversariales   — ambiguas, multi-control, o que invitan a alucinar
#
# Los 30 respondibles estan estratificados por ESTILO DE CONSULTA, porque en la
# fase 1 se midio que BM25 pasa de recall@5=0.318 sobre parafrasis coloquiales a
# recall@5=1.000 sobre consultas con jerga NIST. Sin estratificar, el resultado
# de la ablacion seria un artefacto de como estan redactadas las preguntas.
#   paraphrase    (10) — lenguaje de usuario, sin terminos del titulo
#   lexical       (10) — jerga NIST o ID, como busca un auditor
#   multi_control (10) — requieren varios controles, sin regalar los IDs
#
# Con n=10 por estrato las cifras por estrato son direccionales, no concluyentes.
# La metrica primaria es el agregado sobre los 30, siempre con su IC bootstrap.
#
# Campos:
#   expected_control_ids   — ground truth; cuenta para recall/MRR/nDCG
#   acceptable_control_ids — no penaliza si aparece, pero no hace falta acertarlo
#   must_refuse            — el generador DEBE rehusar
#   must_not_invent        — texto que la respuesta no puede afirmar (anti-alucinacion)

version: 1
corpus: NIST SP 800-53 Rev 5.2.0 (OSCAL)

cases:

# ---------------------------------------------------------------------------
# RESPONDIBLES — estilo parafrasis (10)
# ---------------------------------------------------------------------------
- id: gs-001
  type: answerable
  style: paraphrase
  question: An employee is leaving the company on Friday. What does the standard require us to do about their access?
  expected_control_ids: [ps-4]
  acceptable_control_ids: [ac-2, ps-5]
  notes: PS-4 Personnel Termination. AC-2 tambien es razonable por la parte de cuentas.

- id: gs-002
  type: answerable
  style: paraphrase
  question: How long do we have to keep our logs before we are allowed to delete them?
  expected_control_ids: [au-11]
  acceptable_control_ids: [si-12]
  notes: AU-11 Audit Record Retention. El periodo concreto es definido por la organizacion.

- id: gs-003
  type: answerable
  style: paraphrase
  question: Someone keeps entering the wrong password over and over. What has to happen?
  expected_control_ids: [ac-7]
  acceptable_control_ids: [ac-7.4, ia-5]
  notes: AC-7 Unsuccessful Logon Attempts.

- id: gs-004
  type: answerable
  style: paraphrase
  question: Do we need to check somebody's background before we let them near the system?
  expected_control_ids: [ps-3]
  acceptable_control_ids: [ps-2, ps-7]
  notes: PS-3 Personnel Screening.

- id: gs-005
  type: answerable
  style: paraphrase
  question: How are we supposed to get rid of old hard drives so that nobody can recover what was on them?
  expected_control_ids: [mp-6]
  acceptable_control_ids: [sr-12]
  notes: MP-6 Media Sanitization.

- id: gs-006
  type: answerable
  style: paraphrase
  question: Are staff allowed to install whatever software they like on their work laptops?
  expected_control_ids: [cm-11]
  acceptable_control_ids: [cm-7, cm-10]
  notes: CM-11 User-installed Software.

- id: gs-007
  type: answerable
  style: paraphrase
  question: Our team wants to connect to internal systems from a coffee shop. What does the standard say about that?
  expected_control_ids: [ac-17]
  acceptable_control_ids: [ac-19, ac-20, sc-8]
  notes: AC-17 Remote Access.

- id: gs-008
  type: answerable
  style: paraphrase
  question: Do we have to keep track of every single device that is part of the system?
  expected_control_ids: [cm-8]
  acceptable_control_ids: [pm-5]
  notes: CM-8 System Component Inventory.

- id: gs-009
  type: answerable
  style: paraphrase
  question: We found a security bug in our own software. What are we obliged to do about it?
  expected_control_ids: [si-2]
  acceptable_control_ids: [ra-5, ca-5]
  notes: SI-2 Flaw Remediation. RA-5 cubre el descubrimiento, SI-2 la correccion.

- id: gs-010
  type: answerable
  style: paraphrase
  question: Does the standard say anything about showing users a warning message before they sign in?
  expected_control_ids: [ac-8]
  acceptable_control_ids: [ac-9]
  notes: AC-8 System Use Notification.

