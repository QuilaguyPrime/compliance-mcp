name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # Este proyecto no usa uv.lock (se instala con `uv pip install -e`),
          # y el glob por defecto de la accion es **/uv.lock: sin esto la accion
          # falla por no encontrar fichero al que atar la cache.
          cache-dependency-glob: pyproject.toml

      - name: Instalar dependencias
        # Sin el extra `dense`: los tests de fusion, metricas, filtros y rehuso
        # no necesitan modelo de embeddings, asi que este job no descarga torch.
        # Con `serve`: mcp, anthropic y openai son puros de Python y no arrastran
        # torch, asi que los tests del servidor corren aqui en vez de saltarse.
        #
        # En un venv explicito y no con `uv sync`: sync resuelve el proyecto y
        # ESCRIBE uv.lock en la raiz. Ese fichero no esta versionado, asi que
        # ensucia el arbol de trabajo, y los generadores de artefactos se niegan
        # a producir numeros desde un arbol sucio. Ver el paso de ablacion.
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev,serve]"

      - name: Lint
        run: .venv/bin/python -m ruff check src tests

      - name: Ingest del catalogo
        run: .venv/bin/python -m compliance_mcp.build_index ingest

      - name: Preflight
        # Se exige solo lo que este job tiene: no construye indice denso ni usa
        # proveedores. Lo demas se informa pero no decide el resultado, asi que
        # esto es un gate de verdad y no un `|| true` decorativo.
        run: .venv/bin/python -m compliance_mcp.doctor --require corpus,golden_set

      - name: pytest
        run: .venv/bin/python -m pytest --cov=compliance_mcp --cov-report=term-missing

  eval-gate:
    name: Gate de evaluacion
    runs-on: ubuntu-latest
    # A nivel de job para poder condicionar el paso de generacion a que la clave
    # exista: sin secreto (p.ej. en un PR desde un fork) se corre el gate de
    # recuperacion y se omite el de generacion, en vez de fallar el workflow.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # Este proyecto no usa uv.lock (se instala con `uv pip install -e`),
          # y el glob por defecto de la accion es **/uv.lock: sin esto la accion
          # falla por no encontrar fichero al que atar la cache.
          cache-dependency-glob: pyproject.toml

      - name: Instalar dependencias (con indice denso y proveedores)
        # En un venv y no con --system: el Python del runner es "externally
        # managed" (PEP 668) y rechaza la instalacion. Ademas es el mismo camino
        # que `make install-serve`, asi que CI y local instalan igual, y todo lo
        # que sigue se invoca con .venv/bin/python igual que en el Makefile: asi
        # tambien EJECUTAN igual, no solo instalan.
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dense,serve,dev]"

      - name: Cachear el modelo de embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # La clave nombra el modelo, no hashea config.yaml. Con el hash, tocar
          # un comentario del fichero invalidaba la cache y obligaba a bajar de
          # nuevo los 419 MB de pesos: paso, y ese paso tardo 21 minutos. Lo que
          # decide que hay en ~/.cache/huggingface es `retrieval.dense.model`, y
          # si cambia hay que cambiar esta clave con el.
          key: hf-bge-base-en-v1.5

      - name: Construir corpus e indice
        # --all: la ablacion compara las tres estrategias de chunking, no solo
        # la que se sirve. Sin esto la corrida muere a mitad buscando emb_A.
        run: |
          .venv/bin/python -m compliance_mcp.build_index ingest
          .venv/bin/python -m compliance_mcp.build_index index --all

      - name: Preflight
        # Aqui si hay indice: si estuviera caducado respecto al corpus, la
        # ablacion mediria un indice que no es el que se sirve. Se para antes.
        # Los proveedores no se exigen: en un PR desde un fork no hay secreto y
        # el gate de recuperacion tiene que poder correr igual.
        run: .venv/bin/python -m compliance_mcp.doctor --require corpus,index,ablation_index,golden_set

      - name: Ablacion sobre el split de test
        run: .venv/bin/python -m compliance_mcp.eval.ablation --split test

      - name: Evaluacion de la generacion
        # Gasta API, asi que solo corre cuando hay clave. Inyecta su bloque
        # resumen en data/derived/ablation.json, que es donde lo busca el gate.
        # El baseline extractivo nunca se inyecta (ver eval/generation.py).
        if: env.ANTHROPIC_API_KEY != ''
        run: .venv/bin/python -m compliance_mcp.eval.generation --split test

      - name: Gate
        # Los umbrales viven en `gates:` de config.yaml, no aqui: el criterio
        # de aceptacion se versiona junto al codigo que evalua. Si el paso
        # anterior no corrio, el gate solo hace cumplir la recuperacion.
        run: .venv/bin/python -m compliance_mcp.eval.gate

      - name: Publicar resultados de la evaluacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ablation-results
          path: data/derived/

  docker:
    name: Imagen sin claves
    runs-on: ubuntu-latest
    # Solo en main: el job tarda 18 minutos porque construye la imagen entera,
    # y dentro de ella repite el ingest y el indice que `eval-gate` ya hace. En
    # una PR se pagarian dos veces los mismos 13 minutos de trabajo. Lo que este
    # job afirma -que la imagen arranca en una maquina limpia sin claves- cambia
    # con el Dockerfile, no con cada commit.
    if: github.ref == 'refs/heads/main'
    # Afirma lo que el README promete: que esto arranca en una maquina limpia,
    # sin credenciales y sin red. Se comprobo a mano una vez; aqui queda
    # comprobado en cada push, que es donde lo ve quien evalua el repo.
    #
    # Sin `env:` a proposito. Este job NO recibe ANTHROPIC_API_KEY ni
    # OPENAI_API_KEY: si las tuviera dejaria de medir lo que dice medir.
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        # Nativo: los runners de Actions son x86_64, asi que linux/amd64 no
        # emula aqui. La emulacion solo penaliza al construir en Apple Silicon.
        run: docker build --platform linux/amd64 -t compliance-mcp:ci .

      - name: Tamano de la imagen
        run: |
          docker images compliance-mcp:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          docker history compliance-mcp:ci --format '{{.Size}}\t{{.CreatedBy}}' \
            | grep -v '^0B' | head -6

      - name: Preflight dentro del contenedor
        # Sin claves, `providers` DEBE fallar: answer_question no puede
        # responder sin proveedor. Lo que se exige es que falle SOLO por eso.
        # Aceptar el fallo entero seria aceptar tambien un corpus ausente o un
        # indice caducado, que es justo lo que este paso existe para detectar.
        run: |
          docker run --rm --entrypoint /opt/venv/bin/python compliance-mcp:ci \
            -m compliance_mcp.doctor 2>&1 | tee doctor.log || true
          python - <<'EOF'
          import json, re, sys
          line = next(l for l in open("doctor.log") if "doctor.completed" in l)
          event = json.loads(line[line.index("{"):])
          print("failed:", event["failed"], "| warned:", event["warned"])
          if event["failed"] != ["providers"] or event["warned"]:
              sys.exit("El preflight fallo por algo mas que la falta de credenciales")
          EOF

      - name: Consulta real sin red
        # --network none: el modelo tiene que salir de la cache horneada en la
        # imagen. Si faltara, aqui se veria en vez de en la primera consulta de
        # un usuario.
        run: |
          docker run --rm --network none compliance-mcp:ci -c "
          from compliance_mcp.config import load_config
          from compliance_mcp.retrieval.search import Retriever
          hits = Retriever.build(load_config(None), with_dense=True).search(
              'how often must audit records be reviewed?', top_k=3)
          assert hits, 'search_controls no devolvio ningun control'
          for h in hits:
              print(f'{h.rank}. {h.label} {h.title}')
          " 2>&1 | tee query.log
          grep -qE '^1\. [A-Z]{2}-[0-9]' query.log \
            || { echo "La consulta no devolvio controles"; exit 1; }
